domain_standards:
- id: openid-ssf
  name: OpenID Shared Signals Framework (SSF) 1.0
  conforms: true
  spec: https://openid.net/specs/openid-sharedsignals-framework-1_0-ID3.html
  evidence: openapi/_original/authentik-openapi.yml#/paths/~1ssf~1streams~1
  contract_location: 'Declared in the contract, not only in prose: the published OpenAPI
    carries an `ssf` tag with GET /ssf/streams/, GET /ssf/streams/{uuid}/ and DELETE
    /ssf/streams/{uuid}/ (the SSF stream-management surface a receiver calls on the
    transmitter), plus an `ssf` provider CRUD surface at /providers/ssf/. authentik acts as
    the SSF TRANSMITTER, emitting Security Event Tokens (SETs) to subscribed receivers.'
  docs: https://docs.goauthentik.io/add-secure-apps/providers/ssf/
  note: This is the domain standard for the identity market — a receiver that already
    speaks SSF/CAEP subscribes to authentik's signal stream with no bespoke connector.
    Named on the pricing page as "Shared Signals Framework (ABM) support" in the Enterprise
    tier; the reference integration is Apple Business Manager.
