components:
  schemas:
    PatchedApplicationRequest:
      type: object
      description: Application Serializer
      properties:
        name:
          type: string
          minLength: 1
          description: Application's display Name.
        slug:
          type: string
          minLength: 1
          description: Internal application name, used in URLs.
          pattern: ^[-a-zA-Z0-9_]+$
        provider:
          type:
          - integer
          - 'null'
        backchannel_providers:
          type: array
          items:
            type: integer
        open_in_new_tab:
          type: boolean
          description: Open launch URL in a new browser tab or window.
        meta_launch_url:
          type: string
          format: uri
        meta_icon:
          type: string
        meta_description:
          type: string
        meta_publisher:
          type: string
        policy_engine_mode:
          $ref: '#/components/schemas/PolicyEngineMode'
        group:
          type: string
        meta_hide:
          type: boolean
          description: Hide this application from the user's My applications page.
    Role:
      type: object
      description: Role serializer
      properties:
        pk:
          type: string
          format: uuid
          readOnly: true
          title: Uuid
        name:
          type: string
      required:
      - name
      - pk
    Token:
      type: object
      description: Token Serializer
      properties:
        pk:
          type: string
          format: uuid
          readOnly: true
          title: Token uuid
        managed:
          type:
          - string
          - 'null'
          title: Managed by authentik
          description: Objects that are managed by authentik. These objects are created and updated automatically. This flag only indicates that an object can be overwritten by migrations. You can still modify the objects via the API, but expect changes to be overwritten in a later update.
        identifier:
          type: string
          maxLength: 255
          pattern: ^[-a-zA-Z0-9_]+$
        intent:
          $ref: '#/components/schemas/IntentEnum'
        user:
          type: integer
        user_obj:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        description:
          type: string
        expires:
          type:
          - string
          - 'null'
          format: date-time
        expiring:
          type: boolean
      required:
      - identifier
      - pk
      - user_obj
    Link:
      type: object
      description: Returns a single link
      properties:
        link:
          type: string
      required:
      - link
    ProxyMode:
      enum:
      - proxy
      - forward_single
      - forward_domain
      type: string
    PaginatedBrandList:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        results:
          type: array
          items:
            $ref: '#/components/schemas/Brand'
        autocomplete:
          $ref: '#/components/schemas/Autocomplete'
      required:
      - autocomplete
      - pagination
      - results
    BrandRequest:
      type: object
      description: Brand Serializer
      properties:
        domain:
          type: string
          minLength: 1
          description: Domain that activates this brand. Can be a superset, i.e. `a.b` for `aa.b` and `ba.b`
        default:
          type: boolean
        branding_title:
          type: string
          minLength: 1
        branding_logo:
          type: string
          minLength: 1
        branding_favicon:
          type: string
          minLength: 1
        branding_custom_css:
          type: string
        branding_default_flow_background:
          type: string
          minLength: 1
        branding_map_tiles:
          type: string
          description: URL template for the vector tile source used by the events map. Supports XYZ templates with {z}, {x} and {y} placeholders, or pmtiles:// archive URLs. When empty, the frontend uses the bundled hexworld basemap. This value is part of the brand information served to unauthenticated clients; do not embed API keys or other credentials in it.
        flow_authentication:
          type:
          - string
          - 'null'
          format: uuid
        flow_user_switch:
          type:
          - string
          - 'null'
          format: uuid
        flow_invalidation:
          type:
          - string
          - 'null'
          format: uuid
        flow_recovery:
          type:
          - string
          - 'null'
          format: uuid
        flow_unenrollment:
          type:
          - string
          - 'null'
          format: uuid
        flow_user_settings:
          type:
          - string
          - 'null'
          format: uuid
        flow_device_code:
          type:
          - string
          - 'null'
          format: uuid
        flow_lockdown:
          type:
          - string
          - 'null'
          format: uuid
        flow_request:
          type:
          - string
          - 'null'
          format: uuid
        default_application:
          type:
          - string
          - 'null'
          format: uuid
          description: When set, external users will be redirected to this application after authenticating.
        web_certificate:
          type:
          - string
          - 'null'
          format: uuid
          description: Web Certificate used by the authentik Core webserver.
        client_certificates:
          type: array
          items:
            type: string
            format: uuid
          description: Certificates used for client authentication.
        attributes:
          type: object
          additionalProperties: {}
      required:
      - domain
    WSFedSAMLVersionEnum:
      enum:
      - '1.1'
      - '2.0'
      type: string
    LogLevelEnum:
      enum:
      - critical
      - exception
      - error
      - warn
      - warning
      - info
      - debug
      - notset
      type: string
    RelatedGroup:
      type: object
      description: Stripped down group serializer to show relevant children/parents for groups
      properties:
        pk:
          type: string
          format: uuid
          readOnly: true
          title: Group uuid
        name:
          type: string
        is_superuser:
          type: boolean
          description: Users added to this group will be superusers.
        attributes:
          type: object
          additionalProperties: {}
        group_uuid:
          type: string
          format: uuid
          readOnly: true
      required:
      - group_uuid
      - name
      - pk
    ThemedUrls:
      type: object
      description: Themed URLs - maps theme names to URLs for light and dark themes
      properties:
        light:
          type:
          - string
          - 'null'
        dark:
          type:
          - string
          - 'null'
    SAMLBindingsEnum:
      enum:
      - redirect
      - post
      type: string
    User:
      type: object
      description: User Serializer
      properties:
        pk:
          type: integer
          readOnly: true
          title: ID
        username:
          type: string
          maxLength: 150
        name:
          type: string
          description: User's display name.
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect this instead of deleting accounts.
        last_login:
          type:
          - string
          - 'null'
          format: date-time
        date_joined:
          type: string
          format: date-time
          readOnly: true
        is_superuser:
          type: boolean
          readOnly: true
        groups:
          type: array
          items:
            type: string
            format: uuid
        groups_obj:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/PartialGroup'
          readOnly: true
        roles:
          type: array
          items:
            type: string
            format: uuid
        roles_obj:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Role'
          readOnly: true
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        avatar:
          type: string
          description: User's avatar, either a http/https URL or a data URI
          readOnly: true
        attributes:
          type: object
          additionalProperties: {}
        uid:
          type: string
          readOnly: true
        path:
          type: string
        type:
          $ref: '#/components/schemas/UserTypeEnum'
        uuid:
          type: string
          format: uuid
          readOnly: true
        password_change_date:
          type: string
          format: date-time
          readOnly: true
        last_updated:
          type: string
          format: date-time
          readOnly: true
      required:
      - avatar
      - date_joined
      - groups_obj
      - is_superuser
      - last_updated
      - name
      - password_change_date
      - pk
      - roles_obj
      - uid
      - username
      - uuid
    DigestAlgorithmEnum:
      enum:
      - http://www.w3.org/2000/09/xmldsig#sha1
      - http://www.w3.org/2001/04/xmlenc#sha256
      - http://www.w3.org/2001/04/xmldsig-more#sha384
      - http://www.w3.org/2001/04/xmlenc#sha512
      type: string
    Autocomplete:
      type: object
      additionalProperties: {}
    UiThemeEnum:
      enum:
      - automatic
      - light
      - dark
      type: string
    TokenRequest:
      type: object
      description: Token Serializer
      properties:
        managed:
          type:
          - string
          - 'null'
          minLength: 1
          title: Managed by authentik
