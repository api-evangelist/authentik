components:
  schemas:
    Notification:
      type: object
      description: Notification Serializer
      properties:
        pk:
          type: string
          format: uuid
          readOnly: true
          title: Uuid
        severity:
          allOf:
          - $ref: '#/components/schemas/SeverityEnum'
          readOnly: true
        body:
          type: string
          readOnly: true
        hyperlink:
          type:
          - string
          - 'null'
          maxLength: 4096
        hyperlink_label:
          type:
          - string
          - 'null'
        created:
          type: string
          format: date-time
          readOnly: true
        event:
          $ref: '#/components/schemas/Event'
        seen:
          type: boolean
      required:
      - body
      - created
      - pk
      - severity
    NotificationTransport:
      type: object
      description: NotificationTransport Serializer
      properties:
        pk:
          type: string
          format: uuid
          readOnly: true
          title: Uuid
        name:
          type: string
        mode:
          $ref: '#/components/schemas/TransportModeEnum'
        mode_verbose:
          type: string
          description: Return selected mode with a UI Label
          readOnly: true
        webhook_url:
          type: string
          format: uri
        webhook_ca:
          type:
          - string
          - 'null'
          format: uuid
          description: When set, the selected certificate is used to validate the certificate of the webhook server.
        webhook_mapping_body:
          type:
          - string
          - 'null'
          format: uuid
          description: Customize the body of the request. Mapping should return data that is JSON-serializable.
        webhook_mapping_headers:
          type:
          - string
          - 'null'
          format: uuid
          description: Configure additional headers to be sent. Mapping should return a dictionary of key-value pairs
        email_subject_prefix:
          type: string
        email_template:
          type: string
        send_once:
          type: boolean
          description: Only send notification once, for example when sending a webhook into a chat channel.
      required:
      - mode_verbose
      - name
      - pk
    EventActions:
      enum:
      - login
      - login_failed
      - logout
      - user_write
      - user_offboarded
      - suspicious_request
      - password_set
      - secret_view
      - secret_rotate
      - invitation_used
      - authorize_application
      - source_linked
      - impersonation_started
      - impersonation_ended
      - flow_execution
      - policy_execution
      - policy_exception
      - property_mapping_exception
      - system_task_execution
      - system_task_exception
      - system_exception
      - configuration_error
      - configuration_warning
      - model_created
      - model_updated
      - model_deleted
      - email_sent
      - update_available
      - export_ready
      - review_initiated
      - review_overdue
      - review_attested
      - review_completed
      - access_request_created
      - access_request_approved
      - access_request_denied
      - access_request_revoked
      - custom_
      type: string
    Role:
      type: object
      description: Role serializer
      properties:
        pk:
          type: string
          format: uuid
          readOnly: true
          title: Uuid
        name:
          type: string
      required:
      - name
      - pk
    PaginatedNotificationTransportList:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        results:
          type: array
          items:
            $ref: '#/components/schemas/NotificationTransport'
        autocomplete:
          $ref: '#/components/schemas/Autocomplete'
      required:
      - autocomplete
      - pagination
      - results
    Pagination:
      type: object
      properties:
        next:
          type: number
        previous:
          type: number
        count:
          type: number
        current:
          type: number
        total_pages:
          type: number
        start_index:
          type: number
        end_index:
          type: number
      required:
      - count
      - current
      - end_index
      - next
      - previous
      - start_index
      - total_pages
    EventVolume:
      type: object
      description: Count of events of action created on day for a single event action
      properties:
        action:
          $ref: '#/components/schemas/EventActions'
        time:
          type: string
          format: date-time
        count:
          type: integer
      required:
      - action
