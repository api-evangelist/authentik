components:
  schemas:
    RequestRuleBindingRequest:
      type: object
      description: 'Mixin to validate that a valid enterprise license

        exists before allowing to save the object'
      properties:
        uuid:
          type: string
          format: uuid
        policy_engine_mode:
          $ref: '#/components/schemas/PolicyEngineMode'
        rule:
          type: string
          format: uuid
        target:
          type: string
          format: uuid
        expiry_pending:
          type: string
          minLength: 1
          description: How long a request against this binding stays pending before it automatically lapses if not approved or denied.
        expiry_granted_max:
          type: string
          minLength: 1
          description: The maximum duration a grant approved against this binding can last.
      required:
      - rule
      - target
    Link:
      type: object
      description: Returns a single link
      properties:
        link:
          type: string
      required:
      - link
    RequestableTarget:
      type: object
      description: 'Generic representation of a single request target: whatever was actually

        requested (an Application, an Application Entitlement, ...), always paired with the

        parent it belongs to, so the UI/audit trail has that context even when the

        request itself was scoped narrower than the whole app.'
      properties:
        verbose_name:
          type: string
          description: Return object's verbose_name
          readOnly: true
        verbose_name_plural:
          type: string
          description: Return object's plural verbose_name
          readOnly: true
        meta_model_name:
          type: string
          description: Return internal model name
          readOnly: true
        pbm_uuid:
          type: string
          readOnly: true
        label:
          type: string
          readOnly: true
        parent:
          allOf:
          - $ref: '#/components/schemas/Application'
          readOnly: true
      required:
      - label
      - meta_model_name
      - parent
      - pbm_uuid
      - verbose_name
      - verbose_name_plural
    RelatedTarget:
      type: object
      description: Simplified related target object
      properties:
        verbose_name:
          type: string
          description: Return object's verbose_name
          readOnly: true
        verbose_name_plural:
          type: string
          description: Return object's plural verbose_name
          readOnly: true
        meta_model_name:
          type: string
          description: Return internal model name
          readOnly: true
        pbm_uuid:
          type: string
          readOnly: true
        label:
          type: string
          readOnly: true
      required:
      - label
      - meta_model_name
      - pbm_uuid
