components:
  schemas:
    Stage:
      type: object
      description: Stage Serializer
      properties:
        pk:
          type: string
          format: uuid
          readOnly: true
          title: Stage uuid
        name:
          type: string
        component:
          type: string
          description: Get object type so that we know how to edit the object
          readOnly: true
        verbose_name:
          type: string
          description: Return object's verbose_name
          readOnly: true
        verbose_name_plural:
          type: string
          description: Return object's plural verbose_name
          readOnly: true
        meta_model_name:
          type: string
          description: Return internal model name
          readOnly: true
        flow_set:
          type: array
          items:
            $ref: '#/components/schemas/FlowSet'
          readOnly: true
      required:
      - component
      - flow_set
      - meta_model_name
      - name
      - pk
      - verbose_name
      - verbose_name_plural
    PatchedAuthenticatorValidateStageRequest:
      type: object
      description: AuthenticatorValidateStage Serializer
      properties:
        name:
          type: string
          minLength: 1
        not_configured_action:
          $ref: '#/components/schemas/NotConfiguredActionEnum'
        device_classes:
          type: array
          items:
            $ref: '#/components/schemas/DeviceClassesEnum'
          description: Device classes which can be used to authenticate
        configuration_stages:
          type: array
          items:
            type: string
            format: uuid
          description: Stages used to configure Authenticator when user doesn't have any compatible devices. After this configuration Stage passes, the user is not prompted again.
        last_auth_threshold:
          type: string
          minLength: 1
          description: If any of the user's device has been used within this threshold, this stage will be skipped
        webauthn_user_verification:
          allOf:
          - $ref: '#/components/schemas/UserVerificationEnum'
          description: Enforce user verification for WebAuthn devices.
        webauthn_hints:
          type: array
          items:
            $ref: '#/components/schemas/WebAuthnHintEnum'
        webauthn_allowed_device_types:
          type: array
          items:
            type: string
            format: uuid
        email_otp_throttling_factor:
          type: number
          format: double
        sms_otp_throttling_factor:
          type: number
          format: double
        totp_otp_throttling_factor:
          type: number
          format: double
        static_otp_throttling_factor:
          type: number
          format: double
    AuthTypeEnum:
      enum:
      - basic
      - bearer
      type: string
    DenyStageRequest:
      type: object
      description: DenyStage Serializer
      properties:
        name:
          type: string
          minLength: 1
        deny_message:
          type: string
      required:
      - name
    PatchedRedirectStageRequest:
      type: object
      description: RedirectStage Serializer
      properties:
        name:
          type: string
          minLength: 1
        keep_context:
          type: boolean
        mode:
          $ref: '#/components/schemas/RedirectStageModeEnum'
        target_static:
          type: string
        target_flow:
          type:
          - string
          - 'null'
          format: uuid
    MutualTLSStageRequest:
      type: object
      description: MutualTLSStage Serializer
      properties:
        name:
          type: string
          minLength: 1
        mode:
          $ref: '#/components/schemas/StageModeEnum'
        certificate_authorities:
          type: array
          items:
            type: string
            format: uuid
          description: Configure certificate authorities to validate the certificate against. This option has a higher priority than the `client_certificate` option on `Brand`.
        cert_attribute:
          $ref: '#/components/schemas/CertAttributeEnum'
        user_attribute:
          $ref: '#/components/schemas/UserAttributeEnum'
      required:
      - cert_attribute
      - mode
      - name
      - user_attribute
    UserSetting:
      type: object
      description: Serializer for User settings for stages and sources
      properties:
        object_uid:
          type: string
        component:
          type: string
        title:
          type: string
        configure_url:
          type: string
        icon_url:
          type: string
      required:
      - component
      - object_uid
      - title
    AccountLockdownStage:
      type: object
      description: AccountLockdownStage Serializer
      properties:
        pk:
          type: string
          format: uuid
          readOnly: true
          title: Stage uuid
        name:
          type: string
        component:
          type: string
          description: Get object type so that we know how to edit the object
          readOnly: true
        verbose_name:
          type: string
          description: Return object's verbose_name
          readOnly: true
        verbose_name_plural:
          type: string
          description: Return object's plural verbose_name
          readOnly: true
        meta_model_name:
          type: string
          description: Return internal model name
          readOnly: true
        flow_set:
          type: array
          items:
            $ref: '#/components/schemas/FlowSet'
          readOnly: true
        deactivate_user:
          type: boolean
          description: Deactivate the user account (set is_active to False)
        set_unusable_password:
          type: boolean
          description: Set an unusable password for the user
        delete_sessions:
          type: boolean
          description: Delete all active sessions for the user
        revoke_tokens:
          type: boolean
          description: Revoke all tokens for the user (API, app password, recovery, verification, OAuth)
        self_service_completion_flow:
          type:
          - string
          - 'null'
          format: uuid
          description: Flow to redirect users to after self-service lockdown. This flow should not require authentication since the user's session is deleted.
      required:
      - component
      - flow_set
      - meta_model_name
      - name
      - pk
      - verbose_name
      - verbose_name_plural
    MutualTLSStage:
      type: object
      description: MutualTLSStage Serializer
      properties:
        pk:
          type: string
          format: uuid
          readOnly: true
          title: Stage uuid
        name:
          type: string
        component:
          type: string
          description: Get object type so that we know how to edit the object
          readOnly: true
        verbose_name:
          type: string
          description: Return object's verbose_name
          readOnly: true
        verbose_name_plural:
          type: string
          description: Return object's plural verbose_name
          readOnly: true
        meta_model_name:
          type: string
          description: Return internal model name
          readOnly: true
        flow_set:
          type: array
          items:
            $ref: '#/components/schemas/FlowSet'
          readOnly: true
        mode:
          $ref: '#/components/schemas/StageModeEnum'
        certificate_authorities:
          type: array
          items:
            type: string
            format: uuid
          description: Configure certificate authorities to validate the certificate against. This option has a higher priority than the `client_certificate` option on `Brand`.
        cert_attribute:
          $ref: '#/components/schemas/CertAttributeEnum'
        user_attribute:
          $ref: '#/components/schemas/UserAttributeEnum'
      required:
      - cert_attribute
      - component
      - flow_set
      - meta_model_name
      - mode
      - name
      - pk
      - user_attribute
      - verbose_name
      - verbose_name_plural
    FlowLayoutEnum:
      enum:
      - stacked
      - content_left
      - content_right
      - sidebar_left
      - sidebar_right
      - sidebar_left_frame_background
      - sidebar_right_frame_background
      type: string
    ConsentStageRequest:
      type: object
      description: ConsentStage Serializer
      properties:
        name:
          type: string
          minLength: 1
        mode:
          $ref: '#/components/schemas/ConsentModeEnum'
        consent_expire_in:
          type: string
          minLength: 1
          title: Consent expires in
          description: 'Offset after which consent expires. (Format: hours=1;minutes=2;seconds=3).'
      required:
      - name
    UserDeleteStage:
      type: object
      description: UserDeleteStage Serializer
      properties:
        pk:
          type: string
          format: uuid
          readOnly: true
          title: Stage uuid
        name:
