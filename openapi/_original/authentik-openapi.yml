openapi: 3.1.0
info:
  title: authentik API
  description: |
    Best-effort OpenAPI 3.1 description of the authentik identity provider's REST
    API (v3). authentik exposes a fully OpenAPI-driven REST surface at
    /api/v3 with browsable docs at /api/v3/ on each instance and a generated
    OpenAPI schema at /api/v3/schema/. Derived from public docs at
    https://docs.goauthentik.io/developer-docs/api/.
  version: "3"
  contact:
    name: authentik developer docs
    url: https://docs.goauthentik.io/developer-docs/api/
servers:
  - url: https://{authentik_host}/api/v3
    description: authentik instance API root
    variables:
      authentik_host:
        default: authentik.company
        description: Hostname of your authentik deployment
tags:
  - name: Core
    description: Users, applications, groups and tokens.
  - name: Flows
    description: Authentication and enrollment flows.
  - name: Providers
    description: OAuth2/OIDC, SAML, LDAP, Proxy and other providers.
  - name: Sources
    description: External identity sources.
  - name: Stages
    description: Flow stages (identification, password, etc.).
  - name: Policies
    description: Policies and policy bindings.
  - name: Crypto
    description: Certificate-key pairs.
  - name: Events
    description: Audit and notification events.
  - name: RBAC
    description: Role-based access control.
  - name: Schema
    description: Self-describing OpenAPI schema.
paths:
  /schema/:
    get:
      tags: [Schema]
      summary: OpenAPI schema
      operationId: schemaRetrieve
      responses:
        '200':
          description: OpenAPI v3 schema for this authentik instance
  /core/users/:
    get:
      tags: [Core]
      summary: List users
      operationId: coreUsersList
      responses:
        '200':
          description: Users returned
    post:
      tags: [Core]
      summary: Create user
      operationId: coreUsersCreate
      responses:
        '201':
          description: User created
  /core/users/{id}/:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Core]
      summary: Retrieve user
      operationId: coreUsersRetrieve
      responses:
        '200':
          description: User returned
    put:
      tags: [Core]
      summary: Update user
      operationId: coreUsersUpdate
      responses:
        '200':
          description: User updated
    delete:
      tags: [Core]
      summary: Delete user
      operationId: coreUsersDestroy
      responses:
        '204':
          description: User deleted
  /core/applications/:
    get:
      tags: [Core]
      summary: List applications
      operationId: coreApplicationsList
      responses:
        '200':
          description: Applications returned
    post:
      tags: [Core]
      summary: Create application
      operationId: coreApplicationsCreate
      responses:
        '201':
          description: Application created
  /core/groups/:
    get:
      tags: [Core]
      summary: List groups
      operationId: coreGroupsList
      responses:
        '200':
          description: Groups returned
    post:
      tags: [Core]
      summary: Create group
      operationId: coreGroupsCreate
      responses:
        '201':
          description: Group created
  /core/tokens/:
    get:
      tags: [Core]
      summary: List tokens
      operationId: coreTokensList
      responses:
        '200':
          description: Tokens returned
    post:
      tags: [Core]
      summary: Create token
      operationId: coreTokensCreate
      responses:
        '201':
          description: Token created
  /flows/instances/:
    get:
      tags: [Flows]
      summary: List flows
      operationId: flowsInstancesList
      responses:
        '200':
          description: Flows returned
    post:
      tags: [Flows]
      summary: Create flow
      operationId: flowsInstancesCreate
      responses:
        '201':
          description: Flow created
  /flows/bindings/:
    get:
      tags: [Flows]
      summary: List flow stage bindings
      operationId: flowsBindingsList
      responses:
        '200':
          description: Bindings returned
  /providers/all/:
    get:
      tags: [Providers]
      summary: List providers
      operationId: providersAllList
      responses:
        '200':
          description: Providers returned
  /providers/oauth2/:
    get:
      tags: [Providers]
      summary: List OAuth2/OIDC providers
      operationId: providersOauth2List
      responses:
        '200':
          description: OAuth2 providers returned
    post:
      tags: [Providers]
      summary: Create OAuth2 provider
      operationId: providersOauth2Create
      responses:
        '201':
          description: OAuth2 provider created
  /providers/saml/:
    get:
      tags: [Providers]
      summary: List SAML providers
      operationId: providersSamlList
      responses:
        '200':
          description: SAML providers returned
  /sources/all/:
    get:
      tags: [Sources]
      summary: List sources
      operationId: sourcesAllList
      responses:
        '200':
          description: Sources returned
  /stages/all/:
    get:
      tags: [Stages]
      summary: List stages
      operationId: stagesAllList
      responses:
        '200':
          description: Stages returned
  /policies/all/:
    get:
      tags: [Policies]
      summary: List policies
      operationId: policiesAllList
      responses:
        '200':
          description: Policies returned
  /policies/bindings/:
    get:
      tags: [Policies]
      summary: List policy bindings
      operationId: policiesBindingsList
      responses:
        '200':
          description: Policy bindings returned
  /crypto/certificatekeypairs/:
    get:
      tags: [Crypto]
      summary: List certificate-key pairs
      operationId: cryptoCertificatekeypairsList
      responses:
        '200':
          description: Certificate-key pairs returned
  /events/events/:
    get:
      tags: [Events]
      summary: List events
      operationId: eventsEventsList
      responses:
        '200':
          description: Events returned
  /rbac/roles/:
    get:
      tags: [RBAC]
      summary: List roles
      operationId: rbacRolesList
      responses:
        '200':
          description: Roles returned
  /rbac/permissions/:
    get:
      tags: [RBAC]
      summary: List permissions
      operationId: rbacPermissionsList
      responses:
        '200':
          description: Permissions returned
components:
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema:
        type: string
      description: Object UUID or primary key
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: |
        authentik token authentication. Use header
        `Authorization: Bearer <token>` with a token created in the
        Tokens & App Passwords section.
    sessionAuth:
      type: apiKey
      in: cookie
      name: authentik_session
      description: Browser session cookie for interactive use.
security:
  - tokenAuth: []
  - sessionAuth: []
