components:
  schemas:
    PatchedUniquePasswordPolicyRequest:
      type: object
      description: Password Uniqueness Policy Serializer
      properties:
        name:
          type: string
          minLength: 1
        execution_logging:
          type: boolean
          description: When this option is enabled, all executions of this policy will be logged. By default, only execution errors are logged.
        password_field:
          type: string
          minLength: 1
          description: Field key to check, field keys defined in Prompt stages are available.
        num_historical_passwords:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Number of passwords to check against.
    UniquePasswordPolicyRequest:
      type: object
      description: Password Uniqueness Policy Serializer
      properties:
        name:
          type: string
          minLength: 1
        execution_logging:
          type: boolean
          description: When this option is enabled, all executions of this policy will be logged. By default, only execution errors are logged.
        password_field:
          type: string
          minLength: 1
          description: Field key to check, field keys defined in Prompt stages are available.
        num_historical_passwords:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Number of passwords to check against.
      required:
      - name
    GeoIPPolicyRequest:
      type: object
      description: GeoIP Policy Serializer
      properties:
        name:
          type: string
          minLength: 1
        execution_logging:
          type: boolean
          description: When this option is enabled, all executions of this policy will be logged. By default, only execution errors are logged.
        asns:
          type: array
          items:
            type: integer
            maximum: 2147483647
            minimum: -2147483648
        countries:
          type: array
          items:
            $ref: '#/components/schemas/CountryCodeEnum'
          maxItems: 249
        check_history_distance:
          type: boolean
        history_max_distance_km:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        distance_tolerance_km:
          type: integer
          maximum: 2147483647
          minimum: 0
        history_login_count:
          type: integer
          maximum: 2147483647
          minimum: 0
        check_impossible_travel:
          type: boolean
        impossible_tolerance_km:
          type: integer
          maximum: 2147483647
          minimum: 0
      required:
      - countries
      - name
    EventActions:
      enum:
      - login
      - login_failed
      - logout
      - user_write
      - user_offboarded
      - suspicious_request
      - password_set
      - secret_view
      - secret_rotate
      - invitation_used
      - authorize_application
      - source_linked
      - impersonation_started
      - impersonation_ended
      - flow_execution
      - policy_execution
      - policy_exception
      - property_mapping_exception
      - system_task_execution
      - system_task_exception
      - system_exception
      - configuration_error
      - configuration_warning
      - model_created
      - model_updated
      - model_deleted
      - email_sent
      - update_available
      - export_ready
      - review_initiated
      - review_overdue
      - review_attested
      - review_completed
      - access_request_created
      - access_request_approved
      - access_request_denied
      - access_request_revoked
      - custom_
      type: string
    PolicyBinding:
      type: object
      description: PolicyBinding Serializer
      properties:
        pk:
          type: string
          format: uuid
          readOnly: true
          title: Policy binding uuid
        policy:
          type:
          - string
          - 'null'
          format: uuid
        group:
          type:
          - string
          - 'null'
          format: uuid
        user:
          type:
          - integer
          - 'null'
        policy_obj:
          allOf:
          - $ref: '#/components/schemas/Policy'
          readOnly: true
        group_obj:
          allOf:
          - $ref: '#/components/schemas/PartialGroup'
          readOnly: true
        user_obj:
          allOf:
          - $ref: '#/components/schemas/PartialUser'
          readOnly: true
        target:
          type: string
          format: uuid
        negate:
          type: boolean
          description: Negates the outcome of the policy. Messages are unaffected.
        enabled:
          type: boolean
        order:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        timeout:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Timeout after which Policy execution is terminated.
        failure_result:
          type: boolean
          description: Result if the Policy execution fails.
        expires:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        expiring:
          type: boolean
          readOnly: true
      required:
      - expires
      - expiring
      - group_obj
      - order
      - pk
      - policy_obj
      - target
      - user_obj
    DummyPolicy:
      type: object
      description: Dummy Policy Serializer
      properties:
        pk:
          type: string
          format: uuid
          readOnly: true
          title: Policy uuid
        name:
          type: string
        execution_logging:
          type: boolean
          description: When this option is enabled, all executions of this policy will be logged. By default, only execution errors are logged.
        component:
          type: string
          description: Get object component so that we know how to edit the object
          readOnly: true
        verbose_name:
          type: string
          description: Return object's verbose_name
          readOnly: true
        verbose_name_plural:
          type: string
          description: Return object's plural verbose_name
          readOnly: true
        meta_model_name:
          type: string
          description: Return internal model name
          readOnly: true
        bound_to:
          type: integer
          description: Return objects policy is bound to
          readOnly: true
        result:
          type: boolean
        wait_min:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        wait_max:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
      required:
      - bound_to
      - component
      - meta_model_name
      - name
      - pk
      - verbose_name
      - verbose_name_plural
    PaginatedExpressionPolicyList:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        results:
          type: array
          items:
            $ref: '#/components/schemas/ExpressionPolicy'
        autocomplete:
          $ref: '#/components/schemas/Autocomplete'
      required:
      - autocomplete
      - pagination
      - results
    EventMatcherPolicy:
      type: object
      description: Event Matcher Policy Serializer
      properties:
        pk:
          type: string
          format: uuid
          readOnly: true
          title: Policy uuid
        name:
          type: string
        execution_logging:
          type: boolean
          description: When this option is enabled, all executions of this policy will be logged. By default, only execution errors are logged.
        component:
          type: string
          description: Get object component so that we know how to edit the object
          readOnly: true
        verbose_name:
          type: string
          description: Return object's verbose_name
          readOnly: true
        verbose_name_plural:
          type: string
          description: Return object's plural verbose_name
          readOnly: true
        meta_model_name:
          type: string
          description: Return internal model name
          readOnly: true
        bound_to:
          type: integer
          description: Return objects policy is bound to
          readOnly: true
        action:
          allOf:
          - $ref: '#/components/schemas/EventActions'
          description: Match created events with this action type. When left empty, all action types will be matched.
        client_ip:
          type:
          - string
          - 'null'
          description: Matches Event's Client IP (strict matching, for network matching use an Expression Policy)
        app:
          allOf:
          - $ref: '#/components/schemas/AppEnum'
          description: Match events created by selected application. When left empty, all applications are matched.
        model:
          allOf:
          - $ref: '#/components/schemas/ModelEnum'
          description: Match events created by selected model. When left empty, all models are matched. When an app is selected, all the application's models are matched.
        query:
          type:
          - string
          - 'null'
      required:
      - bound_to
      - component
      - meta_model_name
      - name
      - pk
      - verbose_name
      - verbose_name_plural
    PaginatedReputationList:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        results:
          type: array
