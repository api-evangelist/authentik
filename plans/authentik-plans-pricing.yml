specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Authentik
providerId: authentik
generated: '2026-09-04'
method: searched
source: https://goauthentik.io/pricing
modified: '2026-09-04'
created: '2026-05-04'
plan_count: 3
billing_model: per-user subscription for the product; the REST API is NOT separately
  metered or priced
description: 'Authentik Security prices the authentik PRODUCT, not API calls. authentik is
  self-hosted open-source software: the full REST API (1,193 operations) ships in the free
  Open Source tier with no request quota, no per-call charge and no API-specific plan,
  because the operator runs the server on their own infrastructure. What the paid tiers buy
  is enterprise FEATURES and support, several of which happen to add API surface (agent
  accounts, privileged access management, the SSF provider, Google Workspace and Microsoft
  Entra providers). Prices below are verbatim from the pricing page.'
notes:
- The pricing FAQ states plainly that Authentik Security does not offer a hosted version of
  authentik, so there is no SaaS API endpoint to meter.
- Support is tiered separately from features. Open Source gets "No support" (community
  Discord and GitHub Discussions only); Enterprise gets ticket-based support for
  subscriptions over $1k; Enterprise Plus gets dedicated support and contractual SLAs.
- Service accounts are explicitly free of charge on the Enterprise tier — relevant to
  agent/automation use, since an agent account is a kind of service account.
