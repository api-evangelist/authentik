summary:
  schemas_total: 927
  entities_with_rest_surface: 151
  ref_relationships: 16
  id_reference_fields: 144
  domains: 23
  note: 'authentik is a configuration-graph product, not a records product: the entities are the objects
    an operator wires together (applications, providers, sources, flows, stages, policies, property mappings,
    outposts) plus the identity records themselves (users, groups, roles, tokens). Most cross-object links
    are expressed as bare uuid/slug FIELDS rather than $ref links, which is why the id-reference count
    far exceeds the $ref count — the contract gives an agent the foreign key but not the type it points
    at.'
identifier_conventions:
  primary_key_fields:
  - pk (uuid or int)
  - id (int)
  - uuid
  - slug
  note: 'Identifier style varies by resource family and is a real integration hazard: users and groups
    are addressed by integer or uuid pk, applications and flows by SLUG, providers by integer id, and
    most policy/stage/property-mapping objects by a typed uuid field (policy_uuid, stage_uuid, pm_uuid,
    pbm_uuid). There are no prefixed opaque ids.'
  no_id_prefixes: true
