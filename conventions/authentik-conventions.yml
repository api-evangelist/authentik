  note: 'No Idempotency-Key header (or any equivalent replay token) is declared on any of
    the 636 mutating operations. Retrying a POST creates a second object. The partial
    mitigations that DO exist are structural rather than a replay mechanism: (a) PUT and
    PATCH on a {id} path are naturally idempotent; (b) many resources enforce a unique
    `name` or `slug`, so a duplicate POST fails validation with a 400 rather than creating
