reversibility:
  grade: verified
  summary: 'Mixed, and the mix matters. Two of authentik''s highest-consequence write
    surfaces publish an explicit reversal operation AND a stated window; the ordinary CRUD
    surface has no undo at all — a DELETE is permanent, which is exactly why the
    `used_by` preflight above exists.'
  surfaces:
  - surface: Scheduled user offboarding (deactivate or delete a user at a future time)
    write_operation: lifecycle_user_offboarding_create
    reversal_operation: lifecycle_user_offboarding_destroy
    reversal_path: DELETE /lifecycle/user_offboarding/{id}/
    window: 'Any time before the scheduled date and time. The contract''s own description
      reads "Cancel a pending offboarding instead of deleting the record. The row is
      retained (as CANCELED) so the offboarding stays visible in the audit history."
      authentik checks for due offboardings every five minutes, so the action normally
      starts within five minutes after the scheduled time — cancellation must land before
      that sweep.'
    window_source: https://docs.goauthentik.io/sys-mgmt/user-offboarding
    grade: verified
    caveat: You cannot cancel an offboarding that targets your own account. Once the
      offboarding RUNS with action=Delete, the user is permanently deleted and there is no
      restore path.
  - surface: Access grant (privileged access management)
    write_operation: requests_grant_requests_fulfill_partial_update
    reversal_operation: requests_grant_requests_revoke_destroy
    reversal_path: DELETE /requests/grant-requests/{uuid}/revoke/
    window: 'For as long as the grant is active. The contract states: "Immediately end an
      active grant. Available to the same reviewers who could approve it in the first
      place." Grants also expire automatically after their configured duration.'
    window_source: openapi/_original/authentik-openapi.yml
    grade: verified
  - surface: User impersonation
    write_operation: core_users_impersonate_create
    reversal_operation: core_users_impersonate_end_retrieve
    reversal_path: GET /core/users/impersonate_end/
    window: For the duration of the impersonation session; both start and end are written
      to the events log as impersonation_started / impersonation_ended.
    window_source: openapi/_original/authentik-openapi.yml
    grade: verified
  - surface: Group and role membership
    write_operation: core_groups_add_user_create / rbac_roles_add_user_create
    reversal_operation: core_groups_remove_user_create / rbac_roles_remove_user_create
    reversal_path: POST /core/groups/{group_uuid}/remove_user/ and POST /rbac/roles/{uuid}/remove_user/
    window: No expiry — membership can be removed at any time.
    grade: verified
  - surface: Ordinary object CRUD (users, applications, providers, flows, stages, policies,
      sources, property mappings, certificates, tokens)
    write_operation: '*_destroy (DELETE /<resource>/{id}/)'
    reversal_operation: null
    window: null
    grade: none
    note: 'NO undo, no soft delete, no trash, no restore endpoint anywhere in the 1,193
      operations. A DELETE is immediate and permanent. Before deleting, call
      GET <resource>/{id}/used_by/ to see the cascade, and rely on blueprints
      (https://docs.goauthentik.io/customize/blueprints) or a database backup for recovery
      — those are the operator''s only rollback.'
  - surface: Account lockdown (enterprise)
    write_operation: core_users_account_lockdown_create
    reversal_operation: null
    window: null
    grade: documented
    note: 'Lockdown deactivates the account, invalidates the local password, terminates
      sessions and revokes API/app/recovery/verification/OAuth tokens. Reversal is a manual
      administrative action (reactivate the user, reset the password, reissue tokens) — no
      single "unlock" operation is published, and revoked tokens cannot be restored.'
    window_source: https://docs.goauthentik.io/security/account-lockdown
  - surface: Session revocation
    write_operation: core_authenticated_sessions_destroy / core_authenticated_sessions_bulk_delete_destroy
    reversal_operation: null
    window: null
    grade: none
    note: Revoking a session is terminal; the user must re-authenticate.
  agent_guidance: 'An agent acting on this API should treat DELETE as irreversible
    everywhere except the two scheduled/grant surfaces above, and should call the matching
    `used_by` endpoint first. The offboarding surface is the safe pattern to prefer when
    the intent is "remove this person" — it is scheduled, cancellable and audited, whereas
    core_users_destroy is immediate and final.'
